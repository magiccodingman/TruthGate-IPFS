name: .NET 10 migration build

on:
  push:
    branches:
      - agent/net10-mudblazor-migration
  pull_request:
    branches:
      - magiccodingman/net10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TruthGate-IPFS.sln

      - name: Build
        run: dotnet build TruthGate-IPFS.sln --configuration Release --no-restore
